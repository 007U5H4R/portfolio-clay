# Evaluation harness CI (technical-plan.md §A16 / §B S12.02).
# Runs the full quality gate on every push/PR: typecheck → lint → unit → build → `pnpm eval`.
# NOTE: CI is pending a GitHub remote — this workflow is authored and statically validated
# (action-validator) but has not yet run remotely (no remote exists; do not create one here).
name: eval

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `pnpm build` / `pnpm eval` / `pnpm test:e2e` wrap their command in `dotenv -e .env.tooling`,
    # which pins TMPDIR + PLAYWRIGHT_BROWSERS_PATH to this machine's E Drive (machine constraint).
    # dotenv-cli never overrides a variable already present in the environment, so setting both
    # here keeps the local scar guard intact while giving the Linux runner paths that exist.
    # The Playwright install step below must see the same PLAYWRIGHT_BROWSERS_PATH as the tests.
    env:
      TMPDIR: ${{ runner.temp }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Evaluate
        run: pnpm eval --label ci-${{ github.sha }}

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            evals/results/ci-*.json
            .eval/dead-controls.json
          if-no-files-found: warn

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouseci
          path: .lighthouseci/
          if-no-files-found: ignore
