allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - framer-motion@13.3.0
  - motion-dom@13.3.0
  - motion-utils@13.3.0
  - motion@13.3.0
# Real fix: force `tmp` to the patched line (GHSA-ph9p-34f9-6g65, via @lhci/cli>inquirer).
# Real fix: brace-expansion DoS (GHSA-qhr7-859c-m2p7, GHSA-6j4f-fj2g-mc7p) via @lhci/cli and typescript-eslint, dev-only.
overrides:
  tmp: ">=0.2.6"
  "brace-expansion@<1.1.20": "1.1.21"
  "brace-expansion@>=4.0.0 <5.0.11": "^5.0.11"
  # basic-ftp (GHSA-c475-qrg2-pj4r): only @lhci/cli>…>pac-proxy-agent loads it, for ftp:// PAC files lhci never uses.
  basic-ftp: ">=6.2.1"
# Accepted, unpatchable, dev-only: two `extract-zip` advisories reachable only through
# @lhci/cli>lighthouse>puppeteer-core (Lighthouse CI tooling — never shipped to runtime).
# npm advisory DB lists no patched version for either, so they cannot be overridden away.
auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv
    - GHSA-7pqw-9j4j-h8q3
    # braces (GHSA-vfj7-8cjw-p6xm): no patched version published; dev-only via eslint-config-next>fast-glob>micromatch.
    - GHSA-vfj7-8cjw-p6xm
